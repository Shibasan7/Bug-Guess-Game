<!DOCTYPE html>
<html>
<head>
  <title>Bug Game</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; }
    .chat { border: 1px solid #ddd; padding: 10px; height: 300px; overflow-y: auto; }
    .msg { margin: 5px 0; }
  </style>
</head>
<body>

<h1>🐛 Bug Guessing Game</h1>

<select id="difficulty">
  <option value="easy">Easy</option>
  <option value="hard">Hard</option>
</select>

<button onclick="newGame()">New Game</button>

<div class="chat" id="chat"></div>

<input id="q" placeholder="Ask a question..." />
<button onclick="ask()">Send</button>

<script>

async function newGame() {
  await fetch('/api/set_difficulty', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      difficulty: document.getElementById('difficulty').value
    })
  });

  await fetch('/api/restart', { method: 'POST' });

  document.getElementById('chat').innerHTML = '';
}

function add(msg) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.textContent = msg;
  document.getElementById('chat').appendChild(div);
}

async function ask() {
  const input = document.getElementById('q');
  const text = input.value;
  input.value = '';

  add("You: " + text);

  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ question: text })
  });

  const data = await res.json();

  if (data.error) {
    add("Error: " + data.error);
    return;
  }

  add("Bot: " + data.response);

  if (data.revealed_bug) {
    add("Bug was: " + data.revealed_bug);
  }

  if (data.game_over) {
    add("🎉 Game Over!");
  }
}

</script>
</body>
</html>
